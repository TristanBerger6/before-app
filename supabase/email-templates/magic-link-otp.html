<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <meta name="supported-color-schemes" content="dark" />
  <title>Before — code de connexion</title>
</head>
<body style="margin:0;padding:0;background-color:#09080c;-webkit-text-size-adjust:100%;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color:#09080c;">
    <tr>
      <td align="center" style="padding:40px 16px 48px;">
        <!-- Carte : une seule cellule = border-radius fiable (Gmail, Apple Mail, etc.) -->
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:440px;border-collapse:separate;border-spacing:0;">
          <tr>
            <td
              align="center"
              style="padding:32px 28px;background-color:#1c1826;border:1px solid #2d2838;border-radius:16px;-webkit-border-radius:16px;"
            >
              <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="border-collapse:separate;border-spacing:0;">
                <tr>
                  <td
                    align="center"
                    width="56"
                    height="56"
                    style="width:56px;height:56px;border-radius:14px;-webkit-border-radius:14px;background-color:#2a1f3d;border:1px solid #5b3d8a;font-size:26px;line-height:56px;color:#a855f7;"
                  >
                    ✦
                  </td>
                </tr>
              </table>
              <p style="margin:18px 0 6px;font-family:Georgia,'Times New Roman',serif;font-size:34px;font-weight:700;color:#f4f2f7;letter-spacing:-0.04em;line-height:1.1;">
                Before
              </p>
              <p style="margin:0 0 28px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:14px;color:#9d97ab;line-height:1.5;">
                Le jeu qu'on lance avant de sortir.
              </p>
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="border-collapse:separate;border-spacing:0;">
                <tr>
                  <td style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;text-align:left;">
                    <p style="margin:0 0 6px;font-size:16px;font-weight:600;color:#f4f2f7;">
                      Votre code de connexion
                    </p>
                    <p style="margin:0 0 18px;font-size:14px;color:#9d97ab;line-height:1.6;">
                      Saisissez ce code dans l'application pour sauvegarder vos listes de règles.
                    </p>
                  </td>
                </tr>
                <tr>
                  <td
                    align="center"
                    style="padding:22px 12px;background-color:#13111a;border:1px solid #2d2838;border-radius:12px;-webkit-border-radius:12px;"
                  >
                    <span style="font-family:'SF Mono',Menlo,Consolas,'Courier New',monospace;font-size:30px;font-weight:700;letter-spacing:0.28em;color:#c084fc;line-height:1;">
                      {{ .Token }}
                    </span>
                  </td>
                </tr>
                <tr>
                  <td style="padding-top:22px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
                    <p style="margin:0;font-size:12px;color:#9d97ab;text-align:center;line-height:1.55;">
                      Ce code expire rapidement et ne fonctionne qu'une fois.<br />
                      Vous n'avez rien demandé ? Ignorez ce message.
                    </p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
        <p style="margin:20px 0 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:11px;color:#3d3550;line-height:1.4;">
          Before — pass &amp; play entre amis
        </p>
      </td>
    </tr>
  </table>
</body>
</html>
